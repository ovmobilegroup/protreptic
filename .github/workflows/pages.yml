# .github/workflows/pages.yml —— 前端 SPA + 文档站合并发布到 GitHub Pages（Phase 29-5）
#
# 发布出来的站点结构（Settings → Pages → Source = "GitHub Actions"）：
#   /          → Vue SPA（web/dist 落在产物根，base=/protreptic/）
#   /data/**   → tools/export_static_site.py 产出的静态 JSON 分片
#   /og/**     → tools/build_og_images.py 产出的社交分享图（Phase30-A3）
#   /docs/**   → 文档站（mkdocs 构建，配置见 mkdocs.pages.yml）
#
# ！！人工一步（CI 做不了）：把 Pages Source 从 "Deploy from a branch: main /docs (Jekyll)"
#   切到 "GitHub Actions"。切换后 GitHub 不再渲染 Jekyll，所以文档站必须由本 workflow
#   在同一次发布里重建 —— SPA 与文档站合并成一个 _site/ 产物、一次上传，切换即原子完成，
#   线上 docs/ 的内容不会静默消失。
#
# paths 过滤 + 基线断言：paths 只让「可能改变线上站点」的改动触发发布；基线断言放在
# tools/pages_preflight.py，当数据源（data/modes_data.json + api/protreptic.db）与站点
# 基线对不上时直接失败 —— 防的就是「数据更新了、站点没跟上」。三步断言本地可复跑：
#   python3 tools/export_static_site.py
#   python3 tools/pages_preflight.py --stage data
#   cd web && npm run build && python3 ../tools/pages_preflight.py --stage dist
#   mkdocs build -f mkdocs.pages.yml
#   python3 tools/pages_preflight.py --stage merged
#
# 数据步骤顺序（本 job 自给自足，跨 workflow 不共享工作区）：
#   build_figures_db -> export_static_site -> build_search_index -> build_graph_data
#   -> build_unified_index -> npm run build -> build_og_images -> prerender_routes
#   -> apply_og_meta -> build_sitemap
#   其中 index.unified.json 是 prerender_routes 与 build_og_images 的共同输入，
#   缺了它们会直接非 0 退出（不是静默降级）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'mkdocs.pages.yml'
      - 'web/**'
      - 'docs/**'
      - 'tools/export_static_site.py'
      - 'tools/pages_preflight.py'
      - 'tools/prerender_routes.py'
      - 'tools/prerender_body.py'
      - 'tools/build_unified_index.py'
      - 'tools/build_search_index.py'
      - 'tools/build_graph_data.py'
      - 'tools/build_og_images.py'
      - 'tools/apply_og_meta.py'
      - 'tools/og_image.py'
      - 'tools/build_sw.py'
      - 'tools/build_pwa_icons.py'
      - 'tools/subset_og_font.py'
      - 'tools/assets/fonts/**'
      - 'data/modes_data.json'
      - 'api/protreptic.db'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 正在发布的 run 不打断，排队执行（官方 Pages 模板同语义）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 SPA + 文档站
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Step 0：从已提交 JSON 重建语料库（api/protreptic.db 不入库，CI 现场生成）
      - name: 重建 figures 数据库
        run: python3 tools/build_figures_db.py

      # Step A：静态数据（Vite 把 web/public/data 原样复制成 dist/data）
      - name: 构建静态数据分片
        run: python3 tools/export_static_site.py

      # Step B4: 每日一模式索引 Phase30-B4.
      # 必须紧跟 export (读它产出的 modes/by-figure 分片; 分片顺序就是「每日一模式」的选取顺序),
      # 且必须在下面的 --stage data 断言之前 —— 那道断言会检查 daily/index.json 与 names.json.
      # 产出 daily/index.json (定位, ~12 KB gzip) + daily/names.json (名称表, 只有 /daily 拉).
      # 隔离名单 (H-SX-001) 从 build_unified_index.QUARANTINE 导入, 不复制副本.
      - name: 构建每日一模式索引
        run: python3 tools/build_daily_index.py

      - name: 断言静态数据基线（meta.json 条数）
        run: python3 tools/pages_preflight.py --stage data

      # Step A3: 全文检索索引分片 Phase30-A5.
      # 必须在 tools/export_static_site.py 之后 (它会清空 web/public/data/);
      # 与 tools/build_unified_index.py 相邻, 同样消费 export 的产物.
      # 脚本内置两条自检: 解码回环一致 + 总 gzip <= 800 KB (超了非 0 退出).
      # doc_id 契约 = modes/index-0..7.json 拼接下标, 所以这里读的就是 export 刚写下的分片.
      - name: 构建全文检索索引分片
        run: python3 tools/build_search_index.py

      # Step A4: 关系图谱数据 Phase30-B1.
      # 必须在 export 之后 (graph 目录在 web/public/data/ 下), 与 search 步骤相邻.
      # 产出 mode_edges / concept_graph / similar_modes 三组图谱, 总 gzip <= 1.5 MB.
      - name: 构建关系图谱数据
        run: python3 tools/build_graph_data.py
      # Step A2：统一索引（人物 + 场景合并为一份可浏览名录）
      # prerender_routes.py 与 build_og_images.py 都读它, 缺了会直接失败.
      - name: 构建统一索引
        run: python3 tools/build_unified_index.py

      # Step B：SPA（base 默认 /protreptic/，不要覆盖 VITE_BASE）
      - name: 构建 SPA
        working-directory: web
        env:
          # GitHub Pages 无后端：强制走静态数据适配层
          VITE_DATA_MODE: static
        run: |
          npm ci
          npm run build

      - name: 断言 dist 产物
        run: python3 tools/pages_preflight.py --stage dist
      # Step B1.5: 社交分享图 og:image Phase30-A3.
      # 必须在 npm run build 之后 (读 dist/data/index.unified.json + dist/templates),
      # 在 prerender_routes 之前 (head 由 apply_og_meta 统一收口).
      # 自检: 字形覆盖 (缺字 = 豆腐块) + 逐张 PNG 魔数/尺寸/体积 + 数量与名录对齐.
      - name: 安装分享图依赖
        run: python3 -m pip install --disable-pip-version-check "pillow==11.*" "fonttools==4.*"

      - name: 生成社交分享图 og:image
        run: python3 tools/build_og_images.py

      # Step B2: 路由预渲染 Phase30-A0.
      # GitHub Pages 是纯静态托管, /protreptic/figures 这类深链没有对应文件, 只能回落到
      # 404.html, 页面能渲染但状态码是 404, 已实测. 本步骤为公开名录里的每个路由生成
      # <route>/index.html, 内容 = dist/index.html + 该路由 head, 让深链返回 200;
      # 未覆盖的路径仍回落 404.html, 行为不变.
      # 顺序: 必须在 dist 断言之后. 脚本会用路由壳重写 dist/404.html, 并自检其等于 index.html.
      # Phase30-A2: 关键路由还会带一份静态正文快照 (tools/prerender_body.py), 写进 #app,
      # 覆盖 /figures /modes /templates 列表壳 + 7 个模板页 + 全部人物页 (--body-persons all);
      # 无 JS 的 UA 因此也能读到标题与正文. 有 JS 时 main.ts 在挂载前清空 #app, 不会重复.
      - name: 路由预渲染 深链 200
        run: python3 tools/prerender_routes.py --body-persons all
      # Step B2.5: 把分享图写进每个预渲染页面的 head Phase30-A3.
      # 必须在 prerender_routes 之后: 它重写的是路由页自己的 <route>/index.html.
      # 自检: 图片必须是 dist 里的 1200x630 PNG, 且每页 og:image 恰好一份.
      - name: 写入 og:image / twitter:image
        run: python3 tools/apply_og_meta.py

      # Step B2.6: Service Worker Phase30-A4 —— 产物 dist/sw.js = 线上 /protreptic/sw.js.
      # 必须在 npm run build 之后（读 dist/assets 文件名算 BUILD_ID、读 dist/data/meta.json
      # 算 DATA_REV），也在 prerender 之后（prerender 只写 HTML，不碰 dist/sw.js）。
      # 脚本自带三条断言: assets 里必须有 JS+CSS、预缓存清单里每个文件必须真实存在、
      # 注入后不允许残留 __XXX__ 占位符 —— 任一条不过直接非 0 退出.
      - name: 生成 service worker (sw.js)
        run: python3 tools/build_sw.py

      # Step B3: sitemap.xml (Phase30-C1 质量门要求 sitemap 与路由清单一致)
      # 必须在 prerender 之后跑, 因为 build_sitemap 要读 prerender 产出的 routes manifest.
      # 顺序: export_static_site -> build_unified_index -> prerender -> build_sitemap
      - name: 构建 sitemap
        run: python3 tools/build_sitemap.py

      # Step C：文档站（替代因切换 Pages Source 而失效的 Jekyll 渲染）
      - name: 安装文档站工具链
        run: python3 -m pip install --disable-pip-version-check "mkdocs==1.6.*" "mkdocs-material==9.*"

      - name: 构建文档站
        run: mkdocs build -f mkdocs.pages.yml

      # Step D：合并 dist + docs → _site/（产物根是 SPA，/docs/ 是文档站）
      - name: 合并 SPA + 文档站到 _site
        run: |
          set -euo pipefail
          # runner 每次都是干净的；mkdir 让这一步在热工作区里也能重复执行
          mkdir -p _site
          cp -r web/dist/. _site/          # SPA 在产物根: 404.html + data/ + 795 个预渲染路由目录
          mkdir -p _site/docs
          cp -r site_docs/. _site/docs/    # 文档站放在 /docs/，与 Jekyll 时代的路径一致
          touch _site/.nojekyll
          du -sh _site
          ls -1 _site

      # 合并后必须真的能拿到 /sw.js 与两个 manifest，否则站点白装一遍 PWA
      - name: 断言 sw.js 与 manifest 进了产物
        run: |
          set -euo pipefail
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/manifest-light.webmanifest
          test -f _site/icons/icon-512.png
          python3 tools/build_sw.py --check

      - name: 断言合并产物
        run: python3 tools/pages_preflight.py --stage merged

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
