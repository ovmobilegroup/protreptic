# CI/CD Pipeline for Protreptic
name: Protreptic CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== TEST ====================
  test:
    name: Test (Python + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ---- Phase37-X3：可信度门（存量冻结 / 新增即拦）----
      # push / PR 都过这道门：存量债务只报告，基线外的坏数据直接红。
      - name: 可信度门 · 新增违规必红
        run: python3 tools/credibility_gate.py --hard-fail --data-path data/modes_data.json

      - name: 链接源核验 · 新增坏链必红
        run: python3 tools/verify_source_links.py --hard-fail

      # 铁律 §6.4「任何机检规则都要有负对照测试」：门的负对照不能当 CI 步骤
      # （--negative-test 的成功语义就是 exit 1），改由两个自测守护其语义。
      - name: 可信度门 · 负对照自测（D3 豁免两方向 + 两档七项）
        run: |
          set -euo pipefail
          python3 tools/test_credibility_gate_modes.py
          if [ -f tools/test_credibility_gate.py ]; then
            python3 tools/test_credibility_gate.py
          else
            echo "::notice::tools/test_credibility_gate.py 尚未入库，本步跳过（Phase37-X1 落地后自动生效）"
          fi

      - name: Install Python dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # 让 Python 测试能与"发布口径"交叉校验：index.unified.json 是
      # web/public/data/** 与质量门 tools/ci_data_check.py 共用的计数口径，
      # 其源就是 api/protreptic.db。此步现场生成，不入库（web/public/data/ 已 gitignore）。
      - name: 构建统一索引（测试口径交叉校验用）
        run: python3 tools/build_unified_index.py

      - name: Run Python tests
        run: |
          cd tools
          python3 test_thinking_mode_selector.py

      # TypeScript tests
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Run TypeScript type check
        run: |
          cd web
          npx vue-tsc --noEmit

      - name: Run linting
        run: |
          cd web
          npm run lint 2>/dev/null || echo "No lint script configured"

  # ==================== BUILD API ====================
  build-api:
    name: Build API Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== BUILD WEB ====================
  build-web:
    name: Build Web Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY ====================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server..."
          # Add your staging deployment commands here
          # e.g., ssh to staging server and run docker-compose pull && docker-compose up -d

  deploy-production:
    name: Deploy to Production
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production server..."
          # Add your production deployment commands here
          # e.g., ssh to production server and run docker-compose pull && docker-compose up -d

  # ==================== NOTIFY ====================
  notify:
    name: Notify
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed! Notify team..."
          # Add Slack/Discord/Email notification here