# mkdocs.pages.yml —— GitHub Pages 文档站构建配置（Phase 29-5）
#
# 为什么需要这份配置：
#   线上 https://ovmobilegroup.github.io/protreptic/ 目前由 GitHub 用 Jekyll 渲染 main /docs
#   （docs/_config.yml，主题 jekyll-theme-cayman）。一旦把 Pages Source 切到 GitHub Actions，
#   GitHub 就不再渲染 Jekyll，所以文档站必须由 .github/workflows/pages.yml 在同一次发布里
#   自己重建 —— 这就是本配置的作用。
#
# 为什么不用 docs_site/mkdocs.yml：
#   * 那份属于更早的独立文档站工程，docs_dir 指向 docs_site/docs，nav 里是 341 场景 / 42 模式 /
#     321 人物 的旧快照（2026-08 内容），与线上 docs/ 已经不同步；
#   * 本配置把 docs_dir 直接指向仓库的 docs/，也就是 Jekyll 时代线上发布的那份内容
#     （315 篇 markdown + 人物档案，docs/index.md 为首页），切换后内容零丢失；
#   * 故意不写 nav：导航由 mkdocs 按 docs/ 文件树生成，避免再维护一份会漂移的目录。
#
# 本地：mkdocs build -f mkdocs.pages.yml（产物 site_docs/）  mkdocs serve -f mkdocs.pages.yml

site_name: Protreptic · 思想典藏
site_description: Protreptic · 思想典藏 —— 2868 条历史人物思维模式 × 284 位人物 · 中英双语
site_url: https://ovmobilegroup.github.io/protreptic/docs/
repo_name: ovmobilegroup/protreptic
repo_url: https://github.com/ovmobilegroup/protreptic
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site_docs

# 与 docs/_config.yml 的 exclude 保持一致（Jekyll 时代 archive/ 不发布）
# 注意：mkdocs 1.6 已移除 exclude_patterns 这个名字，写成它会被静默忽略
# （--strict 下只是警告），结果是要排除的 archive/research 又出现在导航里。
# 这里换成 1.6 的正确写法 exclude_docs，恢复 Jekyll 时代的排除语义。
exclude_docs: |
  archive/


theme:
  name: material
  language: zh
  # Phase30-C2 文档站皮肤：模板覆盖在 docs_overrides/，配色在
  # docs_overrides/assets/stylesheets/protreptic.css
  custom_dir: docs_overrides
  logo: assets/images/protreptic.svg
  favicon: assets/images/protreptic.svg
  # 与 SPA 一致：只用系统字体栈，不加载 Google Fonts，也没有第三方网络请求
  font: false
  # primary/accent 都设为 custom：material 预编译的配色类整体让位给
  # protreptic.css，由后者把 --md-* 变量对齐 SPA 的 ink/gold/jade 令牌
  # slate 深墨排第一，与 SPA 的默认深色一致；下标 0=slate / 1=default
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到浅色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到深色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

# Phase30-C2：文档站皮肤样式表，跟 docs_overrides/ 同源，随 site 一起发布
extra_css:
  - assets/stylesheets/protreptic.css

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: [zh, en]

extra:
  generator: false
  # Phase30-C2：文档站回到 SPA 的入口，被 main.html 的 announce 横条与页脚链接引用
  # 线上文档站在 /protreptic/docs/ 下，所以 ../ 就是 SPA 根；本地 mkdocs serve 时
  # 指向服务根，同样可用
  spa_url: ../
  # palette 数组下标：0 = slate 深色，1 = default 浅色
  # main.html 的主题桥用它们把 SPA 的 protreptic-theme 迁移成 material 的 __palette
  palette_index_dark: 0
  palette_index_light: 1

