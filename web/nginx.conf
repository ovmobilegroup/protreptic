server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (带内容哈希的 assets/ 才适合 immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Phase30-A4: service worker 与 manifest 绝对不能长缓存 —— sw.js 字节变了才会触发更新，
    # manifest 换了主题色要立刻生效。精确匹配优先级高于上面的正则，所以顺序不影响。
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
    }
    location = /manifest-light.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}