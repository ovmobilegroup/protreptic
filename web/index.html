<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protreptic · 思想典藏 — 历史人物思维模式库</title>
    <meta name="description"
          content="2868 条思维模式 × 284 位历史人物：每条都有出处、操作步骤与现代应用。以人为鉴，明得失。" />
    <meta name="theme-color" content="#04060c" id="pt-theme-color" />
    <meta name="color-scheme" content="dark light" />

    <!-- 社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Protreptic · 思想典藏" />
    <meta property="og:description" content="2868 条思维模式 × 284 位历史人物 · 中英双语" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 首屏：在读 localStorage 之前先定主题，避免闪白/闪黑 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('protreptic-theme')
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
            document.documentElement.style.background = '#f8f5f0'
          }
        } catch (e) {}
      })()
    </script>

    <!-- 首屏防白闪：与主题同色的底色 -->
    <style>
      html, body { margin: 0; background: #04060c; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f8f5f0; }
      #app:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1100px 600px at 12% -8%, rgba(212,162,76,.10), transparent 60%),
          radial-gradient(900px 520px at 92% 6%, rgba(94,234,212,.07), transparent 55%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
