global_quality_gates:
  - "v8 schema validation: 0 hard errors across all phases"
  - "Cross-civilization mapping: 78 thinking modes ↔ 30 domains ↔ 10 writing techniques complete"
  - "Scenario tag hierarchy: {civilization_sphere: {country: [tags]}} structure implemented"
  - "Field completeness: ≥90% for core fields, ≥70% for optional fields per region"
  - "Mode distinctiveness: all new modes cosine similarity < 0.3 vs existing"
  - "Bilingual parity: 100% zh/en pairs for all text fields"

schema_milestones:
  - milestone: "v7_lock"
    phase: 19
    description: "v7 schema frozen, entity_type mandatory, CI validation active"
  - milestone: "v8_draft"
    phase: 20
    description: "v8 regional profiles drafted, enum expansions proposed"
  - milestone: "v8_review"
    phase: 21
    description: "v8 reviewed with Phase 19-20 data, adjustments made"
  - milestone: "v8_final"
    phase: 22
    description: "v8 finalized, all 22 civilization spheres covered, migration scripts ready"

resource_estimates:
  researchers_needed: 8
  mode_synthesizers: 2
  scenario_generators: 2
  data_engineers: 1
  total_person_months: 36