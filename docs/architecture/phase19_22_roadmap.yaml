          - "8 modes"
      - id: "21.2"
        name: "East Africa (Ethiopia/Kenya/Tanzania/Uganda/Rwanda)"
        assignee: "researcher-africa-east"
        duration_days: 14
        depends_on: ["21.1"]
        outputs:
          - "15 figures"
          - "8 modes"
      - id: "21.3"
        name: "Central & Southern Africa"
