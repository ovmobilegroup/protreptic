# Phase 19-22 Global Expansion Roadmap
# Executable roadmap with tasks, milestones, dependencies, and quality gates
# Format: YAML for CI/CD integration

metadata:
  created: "2026-08-26"
  author: "san-martin"
  version: "1.0"
  baseline_schema: "v7"
  target_schema: "v8"
  total_estimated_figures: 200
  total_estimated_modes: 120
  total_estimated_scenarios: 90

phases:

  - id: 19
    name: "North America & Europe Core"
    priority: "Critical"
    description: "Fill the largest gap - Western canon with zero figures/modes"
    start_date: "2026-09-01"
    end_date: "2026-10-14"
    duration_days: 44
    dependencies: []  # First phase, no deps
    target_countries:
      - US
      - CA
      - UK
      - FR
      - DE
      - IT
      - ES
      - NL
      - BE
      - CH
      - AT
      - PL
      - CZ
    deliverables:
      figures:
        count: 50
        categories:
          - "Founding Fathers & Constitution (US/CA)"
          - "Enlightenment Philosophers (UK/FR/DE)"
          - "Industrial Revolution Leaders (UK/DE/US)"
          - "Wartime Leaders (WW1/WW2/Cold War)"
          - "Post-war Architects (EU, Welfare State)"
          - "Post-Communist Transition (PL/CZ)"
      modes:
        count: 30
        categories:
          - "Democratic Institutionalism"
          - "Federalism & Constitutional Design"
          - "Enlightenment Reason & Critique"
          - "Industrial Organization & Innovation"
          - "Welfare State & Social Democracy"
          - "EU Integration & Supranational Governance"
          - "Post-Communist Transition"
      scenarios:
        count: 20
        type: "country-specific"
    tasks:
      - id: "19.1"
        name: "US/CA Founding & Constitution"
        assignee: "researcher-na"
        duration_days: 14
        depends_on: []
        outputs:
          - "10 figures (Washington, Jefferson, Hamilton, Lincoln, FDR, MLK, Reagan, Macdonald, Laurier, Trudeau)"
          - "5 modes (Federalism, Constitutionalism, Presidential Leadership, Civil Rights, Multiculturalism)"
      - id: "19.2"
        name: "UK/FR/DE Enlightenment & Industry"
        assignee: "researcher-eu-west"
        duration_days: 14
        depends_on: ["19.1"]
        outputs:
          - "15 figures (Cromwell, Burke, Mill, Churchill, Thatcher, Robespierre, Napoleon, de Gaulle, Tocqueville, Bismarck, Weber, Adenauer, Brandt, Merkel, ...)"
          - "10 modes (Parliamentary Sovereignty, Revolutionary Republicanism, Social Market Economy, Ordoliberalism, ...)"
      - id: "19.3"
        name: "ES/IT/NL/BE/CH/AT Nation-states"
        assignee: "researcher-eu-south"
        duration_days: 10
        depends_on: ["19.2"]
        outputs:
          - "10 figures (Cavour, Gramsci, De Gasperi, William of Orange, Thorbecke, Bundesrat founders, ...)"
          - "5 modes (Constitutional Monarchy, Consociationalism, Neutral Mediation, ...)"
      - id: "19.4"
        name: "PL/CZ Post-communist Transition"
        assignee: "researcher-eu-east"
        duration_days: 10
        depends_on: ["19.3"]
        outputs:
          - "8 figures (Piłsudski, Walesa, Masaryk, Havel, Klaus, ...)"
          - "5 modes (Shock Therapy, Lustration, EU Accession, Civil Society, ...)"
      - id: "19.modes"
        name: "Synthesize Phase 19 Modes"
        assignee: "mode-synthesizer"
        duration_days: 20
        depends_on: ["19.1"]
        outputs:
          - "30 validated modes in modes_data.json"
          - "Cross-civilization mapping to 78 thinking modes"
      - id: "19.scenarios"
        name: "Generate Phase 19 Scenarios"
        assignee: "scenario-generator"
        duration_days: 10
        depends_on: ["19.modes"]
        outputs:
          - "20+ scenario tags in scenario_tags.json"
    quality_gates:
      - "All figures pass v7 schema validation (0 hard errors)"
      - "Each figure has ≥3 modes, ≥1 new mode (M262+)"
      - "Bilingual completeness: description_zh/en, reason_zh/en, steps_zh/en, expected_zh/en, case_zh/en"
      - "International fields: nationality, civilization_sphere, time_period_standardized, wiki_id, primary_language, intellectual_tradition, legal_system, education_tradition"
      - "Cross-civilization impact documented"
      - "Mode distinctiveness score > 0.3 vs existing modes"

  - id: 20
    name: "Latin America Deep + Caribbean"
    priority: "High"
    description: "Replace template modes with real research; add Caribbean coverage"
    start_date: "2026-10-15"
    end_date: "2026-11-14"
    duration_days: 31
    dependencies: ["19"]
    target_countries:
      - MX
      - AR
      - BR
      - CL
      - CO
      - PE
      - VE
      - CU
      - BO
      - EC
      - PY
      - UY
      - GT
      - SV
      - HN
      - NI
      - CR
      - PA
      - DO
      - HT
      - JM
      - TT
      - BB
    deliverables:
      figures:
        count: 40
        categories:
          - "Liberators (Bolivar, San Martin, Sucre, O'Higgins, ...)"
          - "Constitutional Reformers (Juarez, Sarmiento, ...)"
          - "Populist Leaders (Peron, Evita, Vargas, Cardenas, ...)"
          - "Revolutionary Figures (Castro, Che, Guevara, Allende, ...)"
          - "Democratic Transitions (Alfonsin, Cardoso, Pinochet transition, ...)"
          - "Caribbean Leaders (Toussaint, Marti, Manley, Williams, ...)"
      modes:
        count: 25
        categories:
          - "Bolivarian Unification"
          - "Constitutional Republicanism"
          - "Peronist Mobilization"
          - "Revolutionary Exportism"
          - "Radical Institutional Transformation"
          - "Neoliberal Reform"
          - "Caribbean Plantocracy & Resistance"
      scenarios:
        count: 20
        type: "country-specific"
    tasks:
      - id: "20.0"
        name: "Purge Template Modes"
        assignee: "data-engineer"
        duration_days: 2
        depends_on: ["19"]
        outputs:
          - "Remove 21 LATAM-GEN-XXX templates from latam_modes.json"
          - "Remove 32 OCE-GEN-XXX templates from oceania_modes.json"
      - id: "20.1"
        name: "Liberators Research"
        assignee: "researcher-latam-liberators"
        duration_days: 10
        depends_on: ["20.0"]
        outputs:
          - "12 figures"
          - "4 modes"
      - id: "20.2"
        name: "Reformers & Populists"
        assignee: "researcher-latam-reform"
        duration_days: 10
        depends_on: ["20.1"]
        outputs:
          - "14 figures"
          - "6 modes"
      - id: "20.3"
        name: "Revolutionaries & Transitions"
        assignee: "researcher-latam-rev"
        duration_days: 10
        depends_on: ["20.2"]
        outputs:
          - "10 figures"
          - "5 modes"
      - id: "20.4"
        name: "Caribbean Nations"
        assignee: "researcher-caribbean"
        duration_days: 10
        depends_on: ["20.3"]
        outputs:
          - "8 figures"
          - "5 modes"
      - id: "20.modes"
        name: "Synthesize Phase 20 Modes"
        assignee: "mode-synthesizer"
        duration_days: 15
        depends_on: ["20.1"]
        outputs:
          - "25 validated modes"
      - id: "20.scenarios"
        name: "Generate Phase 20 Scenarios"
        assignee: "scenario-generator"
        duration_days: 10
        depends_on: ["20.modes"]
        outputs:
          - "20+ scenario tags"
    quality_gates:
      - "Zero template modes remaining in latam_modes.json and oceania_modes.json"
      - "All figures pass v7 schema validation"
      - "Regional integration field: MERCOSUR, CELAC, OAS, CARICOM, SICA"
      - "Conflict resolution: transitional justice, truth commissions, power sharing"
      - "Colonial history field populated for all"

