          - "Pan-Africanism"
          - "Islamic Modernism"
          - "Tribal/Communal Governance"
          - "Resource Governance & Curse Mitigation"
          - "Democratic Transition & Term Limits"
          - "Post-Conflict Reconstruction"
          - "African Union & Regional Integration"
      scenarios:
        count: 25
        type: "country-specific"
    tasks:
      - id: "21.1"
        name: "West Africa (Ghana/Nigeria/Senegal/Ivory Coast)"
        assignee: "researcher-africa-west"
        duration_days: 14
        depends_on: ["20"]
        outputs:
