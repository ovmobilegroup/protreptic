    quality_gates:
      - "All 29 target countries have ≥1 figure"
      - "Islamic deep modes (15) each have ≥1 representative figure"
      - "civilization_sphere field: Sub-Saharan African, North African, Islamic"
      - "conflict_resolution_mechanism: AU mechanisms, truth commissions, transitional justice"
      - "regional_integration: AU, ECOWAS, SADC, EAC, ECCAS, COMESA, AMU"

